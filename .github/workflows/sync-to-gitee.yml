name: Sync to Gitee

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Gitee authentication
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global credential.helper store
          printf "https://%s:%s@gitee.com\n" \
            "$GITEE_USERNAME" \
            "$GITEE_TOKEN" \
            > ~/.git-credentials

          chmod 600 ~/.git-credentials

      - name: Verify Gitee repository
        run: |
          git ls-remote \
            https://gitee.com/hwyzleo/iov-cloud-edd-mpt-ui.git \
            HEAD

      - name: Sync branches and tags
        run: |
          git remote remove gitee 2>/dev/null || true
          git remote add gitee \
            https://gitee.com/hwyzleo/iov-cloud-edd-mpt-ui.git

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            --prune

          git push gitee \
            --prune \
            'refs/remotes/origin/*:refs/heads/*'

          git push gitee \
            --prune \
            'refs/tags/*:refs/tags/*'
